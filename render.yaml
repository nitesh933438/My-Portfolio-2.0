services:
  - type: web
    name: my-portfolio-cms
    runtime: node
    plan: free
    buildCommand: (npm ci || npm install --no-audit --no-fund) && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: VITE_FIREBASE_PROJECT_ID
        value: sapient-spot-gfbwx
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: portfolio-assets
